name: Weekly Security Scan

on:
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  workflow_dispatch: {} # allows a manual "Run workflow" trigger for testing

permissions:
  contents: read
  issues: write

jobs:
  full-scan:
    uses: Ashmere-Software/.github-security/.github/workflows/weekly-security-scan.yml@bca8e4411a91591abff7a0f6acdd51337a6bd461 # main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
